app = "meditransfer-mailer"
primary_region = "fra"

[build]

[env]
  POSTMARK_FROM_EMAIL = "hello@meditransfer.ch"
  POSTMARK_FROM_NAME = "Samuel Beatty · MediTransfer"
  POSTMARK_STREAM = "broadcast"
  MAILER_BASE_URL = "https://meditransfer-mailer.fly.dev"
  MAILER_DB_PATH = "/data/mailer.db"
  SENDER_LEGAL_NAME = "Pom Pom GmbH"
  SENDER_LEGAL_ADDRESS = "Pom Pom GmbH, Kalkbreitestrasse 6, 8003 Zuerich, Switzerland"
  SENDER_REPLY_TO = "hello@meditransfer.ch"
  MAILER_RATE_PER_MINUTE = "300"
  MAILER_DAILY_CAP = "500"

[[mounts]]
  source = "mailer_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
